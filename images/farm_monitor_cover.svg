<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans TC',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B6A7C"/><stop offset="1" stop-color="#4A8A96"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <!-- field plots (面) -->
  <g opacity="0.92">
    <rect x="60"  y="120" width="120" height="70" rx="6" fill="#5BBF8A" stroke="#1f4a55" stroke-width="1.5"/>
    <rect x="190" y="120" width="120" height="70" rx="6" fill="#FF6B6B" stroke="#1f4a55" stroke-width="1.5"/>
    <rect x="60"  y="200" width="120" height="60" rx="6" fill="#FFB84D" stroke="#1f4a55" stroke-width="1.5"/>
    <rect x="190" y="200" width="120" height="60" rx="6" fill="#5BBF8A" stroke="#1f4a55" stroke-width="1.5"/>
    <rect x="320" y="120" width="100" height="140" rx="6" fill="#5BBF8A" stroke="#1f4a55" stroke-width="1.5"/>
  </g>
  <!-- alert markers (點) -->
  <g>
    <circle cx="250" cy="155" r="15" fill="#FF6B6B" stroke="#fff" stroke-width="3"/>
    <text x="250" y="161" font-size="16" text-anchor="middle">🔴</text>
    <circle cx="120" cy="230" r="13" fill="#FFB84D" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- title -->
  <text x="40" y="52" fill="#A8E0D0" font-size="13" font-weight="700" letter-spacing="2">GIS × 生成式 AI · DEMO</text>
  <text x="40" y="86" fill="#ffffff" font-size="26" font-weight="700">農場環境監測</text>
  <text x="40" y="116" fill="#ffffff" font-size="26" font-weight="700">異常提醒 AI Agent</text>
  <!-- chip -->
  <g transform="translate(330,40)">
    <rect width="112" height="26" rx="13" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)"/>
    <text x="56" y="17" fill="#fff" font-size="12" text-anchor="middle">🤖 AI Agent</text>
  </g>
</svg>
